<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A1628">
<title>Avance de Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --azul: #1A6BF0;
  --azul-dark: #005A96;
  --azul-mid: #0D2444;
  --azul-light: rgba(26,107,240,0.08);
  --azul-border: rgba(26,107,240,0.25);
  --dorado: #F5A800;
  --dorado-light: rgba(245,168,0,0.1);
  --bg: #F7F9FC;
  --surface: #FFFFFF;
  --surface2: #EEF3FA;
  --text: #0D1E35;
  --text2: #5A7090;
  --text3: #9BADC4;
  --border: rgba(0,0,0,0.06);
  --border2: rgba(0,0,0,0.1);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
}

@media (prefers-color-scheme: dark) {
  :root {
    --azul: #1A6BF0;
    --azul-dark: #0A1628;
    --azul-mid: #0D2444;
    --azul-light: rgba(26,107,240,0.1);
    --azul-border: rgba(26,107,240,0.3);
    --dorado: #F5A800;
    --dorado-light: rgba(245,168,0,0.12);
    --bg: #060E1C;
    --surface: #0D1E35;
    --surface2: #132540;
    --text: #EEF2FF;
    --text2: #6B82A8;
    --text3: #3D5070;
    --border: rgba(255,255,255,0.06);
    --border2: rgba(255,255,255,0.1);
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* GLOW BG - solo dark mode */
@media (prefers-color-scheme: dark) {
  body::after {
    content: '';
    position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 400px;
    background: radial-gradient(ellipse, rgba(26,107,240,0.15) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
}

/* NAV */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: #005A96;
  border-bottom: 4px solid #F5A800;
}
.nav-top { padding: 14px 20px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nav-brand { display: flex; flex-direction: column; }
.nav-project { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.65); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
.nav-title { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: -0.01em; }
.nav-date-badge {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
  padding: 5px 9px; flex-shrink: 0; white-space: nowrap;
}
.nav-tabs { display: flex; padding: 0 12px; margin-top: 10px; gap: 4px; }
.nav-tab {
  flex: 1; padding: 9px 0; text-align: center;
  color: rgba(255,255,255,0.55); font-size: 13px; font-weight: 500;
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.2s; border-radius: var(--radius-xs) var(--radius-xs) 0 0;
}
.nav-tab.active { color: #fff; border-bottom-color: #fff; }
.nav-tab:not(.active):hover { color: rgba(255,255,255,0.8); }

/* PAGES */
.page { display: none; padding: 20px 16px; position: relative; z-index: 1; }
.page.active { display: block; animation: fadeUp 0.25s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* DATE INPUT */
.date-row { margin-bottom: 20px; }
.field-label {
  font-size: 10px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px;
}
input[type=date] {
  width: 100%; font-size: 15px; font-family: var(--mono);
  padding: 12px 14px; border: 1px solid var(--border2);
  border-radius: var(--radius-sm); background: var(--surface);
  color: var(--text); appearance: none; -webkit-appearance: none;
  transition: border-color 0.2s;
}
input[type=date]:focus { outline: none; border-color: var(--azul); }

/* STEP INDICATOR */
.step-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
.step-pill {
  font-size: 11px; font-weight: 600; padding: 4px 12px;
  border-radius: 20px; border: 1px solid var(--border2);
  color: var(--text3); background: none; transition: all 0.25s;
  white-space: nowrap;
}
.step-pill.done { background: var(--azul); border-color: var(--azul); color: #fff; }
.step-line { flex: 1; height: 1px; background: var(--border2); }

/* SECTION CARD */
.section-card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  transition: border-color 0.2s;
}
.section-card.highlighted { border-color: var(--azul-border); }

/* PARTIDA GRID */
.partida-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.partida-btn {
  padding: 14px 10px; border: 1px solid var(--border2);
  border-radius: var(--radius-sm); background: var(--surface2);
  color: var(--text2); font-size: 13px; font-weight: 600;
  font-family: var(--font); text-align: center; cursor: pointer;
  transition: all 0.18s; position: relative; overflow: hidden;
}
.partida-btn::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--azul), #0D5FE0);
  opacity: 0; transition: opacity 0.18s;
}
.partida-btn span { position: relative; z-index: 1; }
.partida-btn.active { border-color: var(--azul); color: #fff; }
.partida-btn.active::before { opacity: 1; }

/* FRENTE GRID */
.frente-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.frente-btn {
  padding: 12px 6px; border: 1px solid var(--border2);
  border-radius: var(--radius-sm); background: var(--surface2);
  color: var(--text2); font-size: 12px; font-weight: 600;
  font-family: var(--font); text-align: center; cursor: pointer;
  transition: all 0.15s;
}
.frente-btn.active {
  border-color: var(--dorado); background: var(--dorado-light);
  color: var(--dorado);
}

/* UNIDADES */
.bloque-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px; margin-top: 14px;
}
.bloque-label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
.sel-all-btn {
  font-size: 11px; font-weight: 600; padding: 4px 10px;
  border: 1px solid var(--azul-border); border-radius: 20px;
  background: none; color: var(--azul); cursor: pointer;
  font-family: var(--font); transition: all 0.15s;
}
.sel-all-btn:hover { background: var(--azul-light); }
.unit-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.unit-btn {
  padding: 11px 4px; border: 1px solid var(--border2);
  border-radius: var(--radius-xs); background: var(--surface2);
  color: var(--text2); font-size: 12px; font-weight: 600;
  font-family: var(--mono); text-align: center; cursor: pointer;
  transition: all 0.12s;
}
.unit-btn.sel {
  border-color: var(--azul-border); background: var(--azul-light);
  color: var(--azul);
}

/* RESUMEN */
.resumen {
  background: linear-gradient(135deg, rgba(26,107,240,0.08), rgba(245,168,0,0.05));
  border: 1px solid var(--azul-border); border-radius: var(--radius-sm);
  padding: 12px 16px; margin-bottom: 14px;
  font-size: 13px; color: var(--text); line-height: 1.6;
  display: none; animation: fadeUp 0.2s ease;
}
.resumen.visible { display: block; }
.resumen strong { color: var(--azul); }
.resumen small { color: var(--text2); font-family: var(--mono); font-size: 11px; }

/* SAVE BTN */
.save-btn {
  width: 100%; padding: 16px; font-size: 15px; font-weight: 700;
  font-family: var(--font); border: none; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #1A6BF0, #0D5FE0);
  color: #fff; cursor: pointer; letter-spacing: 0.02em;
  box-shadow: 0 4px 20px rgba(26,107,240,0.35);
  transition: all 0.2s; display: none;
}
.save-btn:active { transform: scale(0.98); box-shadow: 0 2px 10px rgba(26,107,240,0.3); }
.save-btn:disabled { background: var(--surface2); box-shadow: none; color: var(--text3); }

/* LOADING */
.loading { text-align: center; padding: 3rem 1rem; color: var(--text2); font-size: 14px; }
.spinner {
  display: inline-block; width: 22px; height: 22px;
  border: 2px solid var(--border2); border-top-color: var(--azul);
  border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* TOAST */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border2);
  padding: 12px 20px; border-radius: 30px;
  font-size: 13px; font-weight: 500; z-index: 999;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap; max-width: 90vw; text-align: center;
  backdrop-filter: blur(20px); box-shadow: var(--shadow);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.ok { background: rgba(26,107,240,0.9); border-color: var(--azul); color: #fff; }
.toast.err { background: rgba(200,40,40,0.9); border-color: rgba(200,40,40,0.5); color: #fff; }

/* HISTORIAL */
.reg-card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 16px; margin-bottom: 10px;
  transition: border-color 0.2s;
}
.reg-card:hover { border-color: var(--border2); }
.reg-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
.reg-partida-title { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.reg-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
.reg-fecha { font-size: 11px; font-family: var(--mono); color: var(--text2); }
.reg-del {
  border: 1px solid rgba(200,40,40,0.25); background: rgba(200,40,40,0.08);
  color: #E05555; font-size: 16px; cursor: pointer;
  padding: 4px 10px; line-height: 1; border-radius: var(--radius-xs);
  flex-shrink: 0; transition: all 0.15s; font-family: var(--font);
}
.reg-del:hover { background: rgba(200,40,40,0.2); }
.reg-section { margin-bottom: 10px; }
.reg-section-label { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  font-size: 11px; padding: 4px 10px; border-radius: 20px;
  font-weight: 500; font-family: var(--mono);
}
.tag-frente { background: var(--dorado-light); color: var(--dorado); border: 1px solid rgba(245,168,0,0.2); }
.tag-unit { background: var(--azul-light); color: #7AADFF; border: 1px solid var(--azul-border); }
.empty-msg { text-align: center; padding: 4rem 1rem; color: var(--text2); font-size: 15px; line-height: 1.8; }

/* DASHBOARD */
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.dash-card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); padding: 16px;
  position: relative; overflow: hidden;
}
.dash-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--azul), var(--dorado));
  opacity: 0.6;
}
.dash-label { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; line-height: 1.4; }
.dash-val { font-size: 28px; font-weight: 700; color: var(--text); font-family: var(--mono); letter-spacing: -0.02em; }
.dash-sub { font-size: 11px; color: var(--text2); margin-top: 3px; font-family: var(--mono); }
.progress-wrap { background: var(--surface2); border-radius: 4px; height: 4px; margin-top: 10px; }
.progress-bar { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--azul), #5A9EFF); transition: width 0.6s ease; }

.bloque-title {
  font-size: 11px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.1em;
  margin: 20px 0 10px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.unit-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px; margin-bottom: 8px;
}
.unit-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 10px; font-family: var(--mono); }
.unit-row { display: flex; align-items: center; margin-bottom: 6px; gap: 8px; }
.unit-row-label { font-size: 11px; color: var(--text2); width: 85px; flex-shrink: 0; font-weight: 500; }
.mini-bar-bg { flex: 1; background: var(--surface2); border-radius: 3px; height: 4px; }
.mini-bar-fill { height: 4px; border-radius: 3px; background: linear-gradient(90deg, var(--azul), #5A9EFF); }
.unit-pct { font-size: 11px; font-weight: 600; color: var(--text2); width: 30px; text-align: right; flex-shrink: 0; font-family: var(--mono); }

/* DIVIDER */
.divider { height: 1px; background: var(--border); margin: 16px 0; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-top">
    <div class="nav-brand">
      <div class="nav-project">Los Portales</div>
      <div class="nav-title">Alameda Vista Verde II</div>
    </div>
    <div class="nav-date-badge" id="nav-date"></div>
  </div>
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="goTab('registro')">Registrar</div>
    <div class="nav-tab" onclick="goTab('historial')">Historial</div>
    <div class="nav-tab" onclick="goTab('dashboard')">Dashboard</div>
  </div>
</nav>

<!-- REGISTRO -->
<div id="page-registro" class="page active">

  <div class="date-row">
    <div class="field-label">Fecha de registro</div>
    <input type="date" id="fecha">
  </div>

  <div class="step-row">
    <div class="step-pill" id="step1">① Partida</div>
    <div class="step-line"></div>
    <div class="step-pill" id="step2">② Frente</div>
    <div class="step-line"></div>
    <div class="step-pill" id="step3">③ Unidades</div>
  </div>

  <div class="section-card" id="card-partida">
    <div class="field-label" style="margin-bottom:12px">Selecciona la partida</div>
    <div class="partida-grid" id="partida-grid"></div>
  </div>

  <div class="section-card" id="frentes-section" style="display:none">
    <div class="field-label" style="margin-bottom:12px">Selecciona el frente <span style="color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0">(puedes elegir varios)</span></div>
    <div class="frente-grid" id="frente-grid"></div>
  </div>

  <div class="section-card" id="unidades-section" style="display:none">
    <div class="field-label" style="margin-bottom:4px">Selecciona las unidades</div>
    <div id="unidades-wrap"></div>
  </div>

  <div class="resumen" id="resumen"></div>
  <button class="save-btn" id="save-btn" onclick="guardar()">Guardar registro</button>
  <div style="height:32px"></div>
</div>

<!-- HISTORIAL -->
<div id="page-historial" class="page">
  <div id="historial-list"></div>
</div>

<!-- DASHBOARD -->
<div id="page-dashboard" class="page">
  <div class="dash-grid" id="dash-cards"></div>
  <div id="dash-units"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxEIraKjZeTntQgOywEyi-7qTyu_h34jkeVdDR_8igarhk0A6X4-3wDuD69QSCrNDpXrw/exec';
const PARTIDAS = ['Encofrado','Acero','Inst. Eléctricas','Inst. Sanitarias','Concreto'];
const CATS = ['Platea','Muro P1','Losa P1','Muro P2','Losa P2'];
const UNITS_F = Array.from({length:13},(_,i)=>'F'+(i+1));
const UNITS_E = Array.from({length:12},(_,i)=>'E'+(i+1));
const UNITS_D = Array.from({length:18},(_,i)=>'D'+(i+3));
const ALL_UNITS = [...UNITS_F,...UNITS_E,...UNITS_D];
const BLOQUES = [{label:'Bloque F',units:UNITS_F},{label:'Bloque E',units:UNITS_E},{label:'Bloque D',units:UNITS_D}];

let selPartida = null;
let selFrente = new Set();
let selUnidades = new Set();

function initDate(){
  const d = new Date();
  document.getElementById('nav-date').textContent = d.toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'});
  document.getElementById('fecha').value = d.toISOString().split('T')[0];
}

function buildPartidas(){
  const el = document.getElementById('partida-grid');
  el.innerHTML = PARTIDAS.map((p,i)=>
    `<button class="partida-btn" id="pb-${i}" onclick="selectPartida(${i})"><span>${p}</span></button>`
  ).join('');
}

function selectPartida(i){
  selPartida = i;
  selFrente.clear();
  selUnidades.clear();
  document.querySelectorAll('.partida-btn').forEach((b,j)=>b.classList.toggle('active', j===i));
  document.getElementById('step1').classList.add('done');
  document.getElementById('card-partida').classList.add('highlighted');
  const fg = document.getElementById('frente-grid');
  fg.innerHTML = CATS.map((c,j)=>
    `<button class="frente-btn" id="fb-${j}" onclick="toggleFrente(${j})">${c}</button>`
  ).join('');
  document.getElementById('frentes-section').style.display='block';
  document.getElementById('unidades-section').style.display='none';
  document.getElementById('save-btn').style.display='none';
  updateResumen();
}

function toggleFrente(j){
  if(selFrente.has(j)) selFrente.delete(j);
  else selFrente.add(j);
  document.querySelectorAll('.frente-btn').forEach((b,k)=>{
    b.classList.toggle('active', selFrente.has(k));
  });
  document.getElementById('step2').classList.toggle('done', selFrente.size>0);
  if(selFrente.size > 0){
    buildUnidades();
    document.getElementById('unidades-section').style.display='block';
  } else {
    document.getElementById('unidades-section').style.display='none';
    document.getElementById('save-btn').style.display='none';
  }
  updateResumen();
}

function buildUnidades(){
  const wrap = document.getElementById('unidades-wrap');
  wrap.innerHTML = BLOQUES.map(b=>`
    <div class="bloque-header">
      <div class="bloque-label">${b.label}</div>
      <button class="sel-all-btn" onclick="selAll('${b.label}')">Sel. todos</button>
    </div>
    <div class="unit-grid">
      ${b.units.map(u=>`<button class="unit-btn ${selUnidades.has(u)?'sel':''}" id="ub-${u}" onclick="toggleUnit('${u}')">${u}</button>`).join('')}
    </div>
  `).join('');
}

function toggleUnit(u){
  if(selUnidades.has(u)) selUnidades.delete(u);
  else selUnidades.add(u);
  const btn = document.getElementById('ub-'+u);
  if(btn) btn.classList.toggle('sel', selUnidades.has(u));
  document.getElementById('step3').classList.toggle('done', selUnidades.size>0);
  document.getElementById('save-btn').style.display = selUnidades.size>0 ? 'block' : 'none';
  updateResumen();
}

function selAll(bloque){
  const b = BLOQUES.find(x=>x.label===bloque);
  if(!b) return;
  const allSel = b.units.every(u=>selUnidades.has(u));
  b.units.forEach(u=>{ if(allSel) selUnidades.delete(u); else selUnidades.add(u); });
  buildUnidades();
  document.getElementById('step3').classList.toggle('done', selUnidades.size>0);
  document.getElementById('save-btn').style.display = selUnidades.size>0 ? 'block' : 'none';
  updateResumen();
}

function updateResumen(){
  const el = document.getElementById('resumen');
  const p = selPartida!==null ? PARTIDAS[selPartida] : '';
  const f = [...selFrente].map(i=>CATS[i]).join(', ');
  const u = [...selUnidades].sort().join(', ');
  if(p && f && u){
    el.innerHTML = `<strong>${p}</strong> · ${f}<br><small>${selUnidades.size} unidad(es): ${u}</small>`;
    el.classList.add('visible');
  } else {
    el.classList.remove('visible');
  }
}

async function guardar(){
  if(selPartida===null){ toast('Selecciona una partida','err'); return; }
  if(selFrente.size===0){ toast('Selecciona al menos un frente','err'); return; }
  if(selUnidades.size===0){ toast('Selecciona al menos una unidad','err'); return; }
  const fecha = document.getElementById('fecha').value || new Date().toISOString().split('T')[0];
  const ts = Date.now();
  const partida = PARTIDAS[selPartida];
  const frentes = [...selFrente].map(i=>CATS[i]);
  const unidades = [...selUnidades].sort();
  const btn = document.getElementById('save-btn');
  btn.disabled=true; btn.textContent='Guardando...';
  toast('Guardando...','');
  try {
    const form = new FormData();
    form.append('action','save');
    form.append('data', JSON.stringify({fecha, partida, frentes, unidades, ts}));
    await fetch(SHEETS_URL, {method:'POST', mode:'no-cors', body: form});
    toast(`✓ Guardado — ${partida} · ${unidades.length} unidades`,'ok');
    resetForm();
  } catch(e){
    toast('Error al guardar. Intenta de nuevo.','err');
  }
  btn.disabled=false; btn.textContent='Guardar registro';
}

function resetForm(){
  selPartida=null; selFrente.clear(); selUnidades.clear();
  document.querySelectorAll('.partida-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('card-partida').classList.remove('highlighted');
  document.getElementById('frentes-section').style.display='none';
  document.getElementById('unidades-section').style.display='none';
  document.getElementById('save-btn').style.display='none';
  document.getElementById('resumen').classList.remove('visible');
  document.querySelectorAll('.step-pill').forEach(s=>s.classList.remove('done'));
  document.getElementById('fecha').value=new Date().toISOString().split('T')[0];
}

async function fetchRegistros(){
  const res = await fetch(SHEETS_URL+'?t='+Date.now());
  const data = await res.json();
  const rows = data.rows || [];
  if(rows.length <= 1) return [];
  const grouped = {};
  rows.slice(1).forEach(r=>{
    const [fecha, partida, frentes, unidades, , ts] = r;
    if(!partida) return;
    const key = String(ts||fecha+'_'+partida);
    if(!grouped[key]) grouped[key]={fecha, partida, frentes: String(frentes).split(', '), unidades: String(unidades).split(', '), ts: key};
  });
  return Object.values(grouped).sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
}

async function cargarHistorial(){
  const el = document.getElementById('historial-list');
  el.innerHTML='<div class="loading"><div class="spinner"></div><br>Cargando registros...</div>';
  try {
    const regs = await fetchRegistros();
    if(!regs.length){ el.innerHTML='<div class="empty-msg">Sin registros aún.<br>Empieza registrando el avance de hoy.</div>'; return; }
    el.innerHTML = regs.map(r=>`
      <div class="reg-card">
        <div class="reg-header">
          <div>
            <div class="reg-partida-title">${r.partida}</div>
            <div class="reg-meta"><span class="reg-fecha">${r.fecha}</span></div>
          </div>
          <button class="reg-del" onclick="borrar('${r.ts}')">Borrar</button>
        </div>
        <div class="reg-section">
          <div class="reg-section-label">Frentes</div>
          <div class="tags">${r.frentes.map(f=>`<span class="tag tag-frente">${f}</span>`).join('')}</div>
        </div>
        <div class="reg-section">
          <div class="reg-section-label">${r.unidades.length} Unidades</div>
          <div class="tags">${r.unidades.map(u=>`<span class="tag tag-unit">${u}</span>`).join('')}</div>
        </div>
      </div>`).join('');
  } catch(e){
    el.innerHTML='<div class="empty-msg">Error al cargar.<br>Verifica tu conexión.</div>';
  }
}

async function borrar(ts){
  if(!confirm('¿Borrar este registro?')) return;
  toast('Borrando...','');
  try {
    const form = new FormData();
    form.append('action','delete');
    form.append('ts', ts);
    await fetch(SHEETS_URL, {method:'POST', mode:'no-cors', body: form});
    toast('Registro borrado','ok');
    await cargarHistorial();
  } catch(e){ toast('Error al borrar','err'); }
}

async function cargarDashboard(){
  const cardsEl = document.getElementById('dash-cards');
  const unitsEl = document.getElementById('dash-units');
  cardsEl.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  try {
    const regs = await fetchRegistros();
    const TOTAL=43; const TC=CATS.length;
    cardsEl.innerHTML = PARTIDAS.map(p=>{
      const comp = ALL_UNITS.filter(u=>{
        const frentesUnit = new Set(regs.filter(r=>r.partida===p&&r.unidades.includes(u)).flatMap(r=>r.frentes));
        return frentesUnit.size === TC;
      }).length;
      const pct = Math.round(comp/TOTAL*100);
      return `<div class="dash-card">
        <div class="dash-label">${p}</div>
        <div class="dash-val">${pct}%</div>
        <div class="dash-sub">${comp} / ${TOTAL} unid.</div>
        <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');

    unitsEl.innerHTML = BLOQUES.map(b=>`
      <div class="bloque-title">${b.label}</div>
      ${b.units.map(u=>{
        const rows = PARTIDAS.map(p=>{
          const done = new Set(regs.filter(r=>r.partida===p&&r.unidades.includes(u)).flatMap(r=>r.frentes));
          const pct = Math.round(done.size/TC*100);
          return `<div class="unit-row">
            <div class="unit-row-label">${p.replace('Inst. ','I.')}</div>
            <div class="mini-bar-bg"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
            <div class="unit-pct">${pct}%</div>
          </div>`;
        }).join('');
        return `<div class="unit-card"><div class="unit-name">${u}</div>${rows}</div>`;
      }).join('')}
    `).join('');
  } catch(e){
    cardsEl.innerHTML='<div class="empty-msg">Error al cargar dashboard.</div>';
  }
}

function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+(type||''); t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

function goTab(id){
  document.querySelectorAll('.nav-tab').forEach((t,i)=>t.classList.toggle('active',['registro','historial','dashboard'][i]===id));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  if(id==='historial') cargarHistorial();
  if(id==='dashboard') cargarDashboard();
}

initDate();
buildPartidas();
</script>
